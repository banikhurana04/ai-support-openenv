name: ai_customer_support_openenv
description: >
  OpenEnv environment for real-world AI customer support workflows.
  The agent handles support tickets through staged interactions:
  classify, respond, and resolve. Internal state tracks ticket status,
  workflow stage, cumulative reward, and full conversation history.

tasks:
  easy:
    objective: "Classify the ticket type correctly."
    required_stages:
      - classify
    success_condition: "Classification matches the ticket issue type."
  medium:
    objective: "Classify correctly and produce an appropriate customer response."
    required_stages:
      - classify
      - respond
    success_condition: >
      Classification is correct and response quality satisfies
      the medium task threshold.
  hard:
    objective: "Complete full customer support workflow across multiple steps."
    required_stages:
      - classify
      - respond
      - resolve
    success_condition: >
      Ticket is correctly classified, appropriately responded to,
      and resolved according to policy (including escalation rules).

observation_space:
  description: "Structured Pydantic observation object returned on reset and step."
  fields:
    - name: id
      type: string
      description: "Canonical ticket ID."
    - name: issue_type
      type: enum(refund|delay|complaint|query)
      description: "Ground-truth issue type for the sampled ticket."
    - name: ticket_id
      type: string
      description: "Ticket reference ID exposed to the agent."
    - name: stage
      type: enum(classify|respond|resolve)
      description: "Current workflow stage."
    - name: status
      type: enum(open|in_progress|resolved)
      description: "Ticket lifecycle state."
    - name: summary
      type: string
      description: "Customer ticket summary text."
    - name: sentiment
      type: string
      description: "Customer sentiment label."
    - name: urgency
      type: integer(1-5)
      description: "Urgency level of the ticket."
    - name: conversation_history
      type: list
      description: "Ordered conversation turns with speaker and message."
    - name: allowed_actions
      type: list
      description: "Valid action types for the current stage."
    - name: metadata
      type: object
      description: "Auxiliary context such as difficulty, customer tier, and task constraints."

action_space:
  description: "Structured Pydantic action object passed to step(action)."
  fields:
    - name: action_type
      type: enum(classify|respond|resolve)
      description: "Action corresponding to current workflow stage."
    - name: classification
      type: optional enum(refund|delay|complaint|query)
      description: "Predicted issue type for classification stage."
    - name: response_text
      type: optional string
      description: "Agent response content for response stage."
    - name: resolve
      type: optional boolean
      description: "Resolution flag for resolve stage."
    - name: escalate
      type: boolean
      description: "Whether to escalate to specialist support."
    - name: notes
      type: object
      description: "Optional free-form structured notes."

reward:
  description: >
    Step-wise reward shaping is applied on every call to step(action),
    with additive penalties where applicable.
  components:
    - rule: "Correct classification"
      value: 0.3
    - rule: "Appropriate response"
      value: 0.3
      notes: "Keyword-based partial scoring can yield proportional intermediate values."
    - rule: "Correct resolution"
      value: 0.4
    - rule: "Wrong actions or incorrect outcomes"
      value: -0.2
    - rule: "Unnecessary extra step"
      value: -0.1
  per_step: true
