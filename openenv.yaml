id: ai_customer_support_openenv
name: AI Customer Support OpenEnv
description: Real-world AI customer support workflow environment.

entry_point: environment:SupportTicketEnv

version: 1.0.0

tasks:
  - id: easy
    description: Classify the ticket type correctly
  - id: medium
    description: Classify and respond to the ticket
  - id: hard
    description: Full workflow: classify, respond, resolve

observation_space:
  type: object
  properties:
    id:
      type: string
    issue_type:
      type: string
      enum: [refund, delay, complaint, query]
    ticket_id:
      type: string
    stage:
      type: string
      enum: [classify, respond, resolve]
    status:
      type: string
      enum: [open, in_progress, resolved]
    summary:
      type: string
    sentiment:
      type: string
    urgency:
      type: integer
    conversation_history:
      type: array
    allowed_actions:
      type: array
    metadata:
      type: object

action_space:
  type: object
  properties:
    action_type:
      type: string
      enum: [classify, respond, resolve]
    classification:
      type: string
      enum: [refund, delay, complaint, query]
    response_text:
      type: string
    resolve:
      type: boolean
    escalate:
      type: boolean
    notes:
      type: object

reward:
  type: float
  range: [0.0, 1.0]